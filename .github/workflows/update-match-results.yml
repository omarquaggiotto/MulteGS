name: Aggiorna risultati partite
on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 17,21 * * 0,6"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-match-results.mjs
